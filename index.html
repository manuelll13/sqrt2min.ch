<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sqrt2min</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0d2880;
      --navy-light: #1a3aaa;
      --off: #f4f5f9;
      --text: #1a1a2e;
      --muted: #6b7280;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--off); color: var(--text); }

    /* ── HERO ── */
    #hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(13,40,128,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(13,40,128,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    .logo-wrap {
      width: 180px;
      height: 200px;
      position: relative;
      animation: floatIn 0.9s cubic-bezier(0.22,1,0.36,1) both;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      bottom: -18px; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 24px;
      background: radial-gradient(ellipse, rgba(13,40,128,0.18) 0%, transparent 70%);
      border-radius: 50%;
    }

    .logo-wrap svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 8px 32px rgba(13,40,128,0.22));
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    .logo-wrap:hover svg { transform: scale(1.06) translateY(-4px); }

    .wordmark {
      font-family: 'Space Mono', monospace;
      font-size: 2rem; font-weight: 700;
      color: var(--navy); letter-spacing: -0.03em;
      animation: floatIn 0.9s 0.15s cubic-bezier(0.22,1,0.36,1) both;
    }

    .wordmark span { color: var(--navy-light); opacity: 0.55; }

    .divider {
      width: 48px; height: 2px;
      background: var(--navy); opacity: 0.2; border-radius: 2px;
      animation: floatIn 0.9s 0.28s cubic-bezier(0.22,1,0.36,1) both;
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      animation: floatIn 1s 0.6s cubic-bezier(0.22,1,0.36,1) both;
      cursor: pointer; opacity: 0.5; transition: opacity 0.2s;
      text-decoration: none;
    }

    .scroll-hint:hover { opacity: 1; }

    .scroll-hint span {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--navy);
    }

    .scroll-hint svg { animation: bounce 1.8s infinite; }

    /* ── MEMES ── */
    #memes { padding: 80px 40px; }

    .memes-header { text-align: center; margin-bottom: 56px; }

    .memes-header h2 {
      font-family: 'Space Mono', monospace;
      font-size: 1.6rem; font-weight: 700;
      color: var(--navy); letter-spacing: -0.02em;
    }

    .memes-header p { margin-top: 10px; font-size: 0.95rem; color: var(--muted); }

    .memes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .meme-card {
      border-radius: 12px; overflow: hidden;
      background: transparent;
      box-shadow: 0 2px 12px rgba(13,40,128,0.08);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
      cursor: pointer;
      align-self: start;
    }

    .meme-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 32px rgba(13,40,128,0.16);
    }

    .meme-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(9,26,92,0.92);
      z-index: 1000; align-items: center; justify-content: center; padding: 24px;
    }

    #lightbox.active { display: flex; }

    #lightbox img {
      max-width: 90vw; max-height: 90vh;
      border-radius: 12px; object-fit: contain;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    #lightbox-close {
      position: absolute; top: 20px; right: 24px;
      background: none; border: none; color: white;
      font-size: 2rem; cursor: pointer; opacity: 0.7; transition: opacity 0.2s;
    }

    #lightbox-close:hover { opacity: 1; }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(8px); }
    }

    @media (max-width: 768px) {
      .memes-grid { grid-template-columns: repeat(2, 1fr); }
      .logo-wrap { width: 140px; height: 155px; }
      .wordmark { font-size: 1.5rem; }
      #memes { padding: 60px 20px; }
    }

    @media (max-width: 480px) {
      .memes-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <div class="scroll-hint" onclick="document.getElementById('memes').scrollIntoView({behavior:'smooth'})">
      <span>Memes</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d2880" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- MEMES -->
  <section id="memes">
    <div class="memes-header">
      <h2>Memes</h2>
      <p>Klick auf ein Bild zum Vergrössern</p>
    </div>
    <div class="memes-grid" id="memesGrid"></div>
  </section>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <button id="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    const totalMemes = 57;
    const grid = document.getElementById('memesGrid');

    for (let i = 1; i <= totalMemes; i++) {
      const card = document.createElement('div');
      card.className = 'meme-card';
      // versucht zuerst .jpg, bei Fehler .png
      const img = document.createElement('img');
      img.src = `memes/meme${i}.jpg`;
      img.alt = `Meme ${i}`;
      img.loading = 'lazy';
      img.onerror = function() {
        if (!this.dataset.tried) {
          this.dataset.tried = '1';
          this.src = `memes/meme${i}.png`;
        } else {
          this.closest('.meme-card').style.display = 'none';
        }
      };
      card.appendChild(img);
      card.addEventListener('click', () => openLightbox(img.src));
      grid.appendChild(card);
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
