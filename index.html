<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sqrt2min</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0d2880;
      --navy-dark: #091a5c;
      --navy-light: #1a3aaa;
      --white: #ffffff;
      --off: #f4f5f9;
      --text: #1a1a2e;
      --muted: #6b7280;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--off);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(13,40,128,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(13,40,128,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      padding: 48px 32px;
    }

    .logo-wrap {
      position: relative;
      width: 180px;
      height: 200px;
      animation: floatIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 24px;
      background: radial-gradient(ellipse, rgba(13,40,128,0.18) 0%, transparent 70%);
      border-radius: 50%;
    }

    .logo-wrap svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 32px rgba(13,40,128,0.22));
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo-wrap:hover svg {
      transform: scale(1.06) translateY(-4px);
    }

    .wordmark {
      font-family: 'Space Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.03em;
      animation: floatIn 0.9s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .wordmark span {
      color: var(--navy-light);
      opacity: 0.55;
    }

    .tagline {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: floatIn 0.9s 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--navy);
      opacity: 0.2;
      border-radius: 2px;
      animation: floatIn 0.9s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .coming-soon {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--navy);
      background: rgba(13,40,128,0.07);
      border: 1px solid rgba(13,40,128,0.15);
      padding: 8px 20px;
      border-radius: 100px;
      animation: floatIn 0.9s 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .logo-wrap { width: 140px; height: 155px; }
      .wordmark { font-size: 1.5rem; }
    }
  </style>
</head>
